<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Signal Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0A0A14;
    --bg-raised: rgba(22, 22, 36, 0.6);
    --bg-elevated: rgba(30, 30, 48, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text-primary: #F8FAFC;
    --text-secondary: #CBD5E1;
    --text-tertiary: #94A3B8;
    --text-muted: #64748B;
    --gold: #FBBF24;
    --gold-soft: rgba(251, 191, 36, 0.12);
    --green: #10B981;
    --green-soft: rgba(16, 185, 129, 0.15);
    --red: #EF4444;
    --red-soft: rgba(239, 68, 68, 0.15);
    --amber: #F59E0B;
    --amber-soft: rgba(245, 158, 11, 0.15);
    --purple: #8B5CF6;
    --pink: #EC4899;
    --blue: #3B82F6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(139, 92, 246, 0.25), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 20%, rgba(236, 72, 153, 0.18), transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(59, 130, 246, 0.2), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.03) 1px, transparent 0);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }
  .header { padding: 28px 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 18px; color: white; box-shadow: 0 4px 24px rgba(139, 92, 246, 0.35); }
  .logo-text h1 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.04em; background: linear-gradient(90deg, #F8FAFC, #CBD5E1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .logo-text .tag { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.06em; margin-top: 2px; }
  .header-meta { display: flex; align-items: center; gap: 20px; }
  .live-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--green-soft); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--green); letter-spacing: 0.08em; text-transform: uppercase; }
  .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); } 50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } }
  .header-date { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 0.1em; color: var(--text-tertiary); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  .card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent); }
  .signal-card { padding: 32px; }
  .card-label { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 20px; }
  .card-label .icon { font-size: 14px; }
  .light-hero { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
  .light-orb { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .light-orb.green { background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.9), rgba(16, 185, 129, 0.4) 60%, transparent 80%); }
  .light-orb.green::before { content: ''; width: 52px; height: 52px; border-radius: 50%; background: var(--green); box-shadow: 0 0 40px var(--green), 0 0 80px rgba(16, 185, 129, 0.4); }
  .light-orb.yellow { background: radial-gradient(circle at 30% 30%, rgba(245, 158, 11, 0.9), rgba(245, 158, 11, 0.4) 60%, transparent 80%); }
  .light-orb.yellow::before { content: ''; width: 52px; height: 52px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 40px var(--amber), 0 0 80px rgba(245, 158, 11, 0.4); }
  .light-orb.red { background: radial-gradient(circle at 30% 30%, rgba(239, 68, 68, 0.9), rgba(239, 68, 68, 0.4) 60%, transparent 80%); }
  .light-orb.red::before { content: ''; width: 52px; height: 52px; border-radius: 50%; background: var(--red); box-shadow: 0 0 40px var(--red), 0 0 80px rgba(239, 68, 68, 0.4); }
  .light-orb.pending { background: radial-gradient(circle at 30% 30%, rgba(148, 163, 184, 0.5), rgba(148, 163, 184, 0.2) 60%, transparent 80%); }
  .light-orb.pending::before { content: ''; width: 52px; height: 52px; border-radius: 50%; background: var(--text-muted); }
  .light-info .status-text { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: 0.02em; margin-bottom: 10px; }
  .status-text.green { color: var(--green); text-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
  .status-text.yellow { color: var(--amber); text-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }

  .cond .delta { font-size: 11px; color: var(--text-tertiary); margin-top: 5px; }

  .pick-cycle { font-size: 10.5px; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
  .pick-strategy { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05; letter-spacing: 0.02em; background: linear-gradient(135deg, #F8FAFC 0%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
  .pick-caption { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }

  .pick-field .v { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 14px; color: var(--text-primary); letter-spacing: 0.02em; }
  .pick-status { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border: 1px solid; border-radius: 12px; }
  .pick-status.live { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.3); }
  .pick-status.completed-win { background: var(--gold-soft); border-color: rgba(251, 191, 36, 0.3); }
  .pick-status.completed-loss { background: var(--red-soft); border-color: rgba(239, 68, 68, 0.3); }
  .pick-status.completed-nf { background: rgba(148, 163, 184, 0.1); border-color: var(--border); }
  .pick-status.scheduled { background: rgba(148, 163, 184, 0.08); border-color: var(--border); }
  .pick-status .left { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  .pick-status .right { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 18px; }

  .pick-status.completed-loss .right { color: var(--red); }

  .kpi .val { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 32px; color: var(--gold); letter-spacing: 0.01em; line-height: 1; }
  .kpi .val.neutral { color: var(--text-primary); }

  table.picks thead th.num { text-align: right; }

  table.picks tbody tr:last-child td { border-bottom: none; }
  table.picks tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
  table.picks tbody td.num { text-align: right; }

  .day-cell .day-date { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.06em; margin-top: 3px; }
  .light-pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid; }
  .light-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .light-pill.green { background: var(--green-soft); color: var(--green); border-color: rgba(16, 185, 129, 0.3); }
  .light-pill.green .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .light-pill.yellow { background: var(--amber-soft); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }

  .strat-sub { font-family: 'Orbitron', sans-serif; font-size: 10.5px; color: var(--text-tertiary); letter-spacing: 0.06em; margin-top: 4px; }
  .result-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.05em; }
  .result-badge.w { background: var(--green-soft); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }

  .result-badge.nf { background: rgba(148, 163, 184, 0.1); color: var(--text-tertiary); border: 1px solid var(--border); }
  .result-badge.pending { color: var(--text-muted); font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .pnl { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }

  .total-row td { padding: 22px 18px !important; background: linear-gradient(90deg, rgba(251, 191, 36, 0.06), rgba(139, 92, 246, 0.04)); border-top: 1px solid var(--border-strong) !important; border-bottom: none !important; }
  .total-row .lbl { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }

  @media (max-width: 900px) {

</style>

<body>

<div class="loading-overlay" id="loading">
  <div class="loading-logo">V</div>
  <div class="loading-text">Loading signals</div>
</div>

<div class="container" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
// =========================================================================
// CONFIG - Update these after setting up the Google Sheet
// =========================================================================
const CONFIG = {
  // Published CSV URL from Google Sheets (File > Share > Publish to web > CSV)
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQl2IT-YvpmREgTOnYPSR47YULpdoZgXbFuDa2vPRPuLh7YBfrEObMj8ifKxwE0oU8yaaEHHqqIHLUi/pub?gid=0&single=true&output=csv',

  // Shion referral link for the CTA button
  REFERRAL_URL: '#',

  // CORS proxy (matches existing vector-dashboard pattern)
  CORS_PROXY: 'https://corsproxy.io/?',

  // Auto-refresh every 5 minutes
  REFRESH_INTERVAL_MS: 5 * 60 * 1000
};

// =========================================================================
// Date utilities
// =========================================================================
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function parseDate(s) {
  if (!s) return null;
  // Expect YYYY-MM-DD
  const parts = s.trim().split('-');
  if (parts.length !== 3) return null;
  return new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
}
function formatDate(d, fmt) {
  if (!d) return '';
  const m = MONTHS[d.getUTCMonth()];
  const day = d.getUTCDate();
  const dow = DAYS[d.getUTCDay()];
  const dowFull = DAYS_FULL[d.getUTCDay()];
  if (fmt === 'short') return `${m} ${day}`;
  if (fmt === 'full') return `${dowFull} · ${m} ${day}`;
  if (fmt === 'chip') return `${m.toUpperCase()} ${day}`;
  if (fmt === 'header') return `${dow.toUpperCase()} · ${day} ${m.toUpperCase()} ${d.getUTCFullYear()}`;
  return `${m} ${day}`;
}
function mondayOf(d) {
  const date = new Date(d);
  const day = date.getUTCDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setUTCDate(date.getUTCDate() + diff);
  date.setUTCHours(0, 0, 0, 0);
  return date;
}
function fridayOf(d) {
  const m = mondayOf(d);
  m.setUTCDate(m.getUTCDate() + 4);
  return m;
}
function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

// =========================================================================
// Data fetching
// =========================================================================
async function fetchSignals() {
  if (!CONFIG.CSV_URL || CONFIG.CSV_URL === 'PASTE_PUBLISHED_CSV_URL_HERE') {
    throw new Error('CSV_URL not configured. Edit index.html and set CONFIG.CSV_URL.');
  }
  const url = CONFIG.CORS_PROXY + encodeURIComponent(CONFIG.CSV_URL + '&_=' + Date.now());
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  // Strip leading apostrophes (Sheets text-marker) from string fields
  const clean = v => {
    if (v === undefined || v === null) return '';
    const s = String(v);
    return s.length > 0 && s.charAt(0) === "'" ? s.slice(1) : s;
  };
  return parsed.data.map(row => ({
    date: clean(row.date),
    day: clean(row.day),
    week_start: clean(row.week_start),
    week_num: row.week_num ? +row.week_num : null,
    light: clean(row.light).toLowerCase(),
    light_rationale: clean(row.light_rationale),
    vix: clean(row.vix),
    vix_delta: clean(row.vix_delta),
    oil: clean(row.oil),
    oil_delta: clean(row.oil_delta),
    geo_status: clean(row.geo_status),
    geo_note: clean(row.geo_note),
    strategy: clean(row.strategy),
    direction: clean(row.direction),
    instrument: clean(row.instrument) || 'NQ JUN26',
    timeframe: clean(row.timeframe) || '15 Min',
    status: clean(row.status).toLowerCase() || 'scheduled',
    result: clean(row.result).toUpperCase(),
    pnl_1nq: row.pnl_1nq ? parseFloat(row.pnl_1nq) : null
  })).filter(r => r.date);
}

// =========================================================================
// Data derivation
// =========================================================================
function deriveViewModel(rows) {
  const today = new Date();
  today.setUTCHours(0, 0, 0, 0);
  const todayKey = dateKey(today);
  const thisMonday = mondayOf(today);
  const thisMondayKey = dateKey(thisMonday);

  // Current week rows (Mon - Fri of this week)
  const currentWeek = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(thisMonday);
    d.setUTCDate(d.getUTCDate() + i);
    const key = dateKey(d);
    const row = rows.find(r => r.date === key);
    currentWeek.push({ date: d, key, row: row || null });
  }

  // Today's row
  const todayRow = rows.find(r => r.date === todayKey) || null;

  // Past weeks (completed, week_start before this Monday)
  const pastWeeks = {};
  rows.forEach(r => {
    if (!r.week_start) return;
    if (r.week_start >= thisMondayKey) return;
    if (!pastWeeks[r.week_start]) pastWeeks[r.week_start] = [];
    pastWeeks[r.week_start].push(r);
  });
  const weekKeys = Object.keys(pastWeeks).sort().reverse();

  // KPIs computed from all rows starting at first available week
  const completed = rows.filter(r => r.status === 'completed');
  const fired = completed.filter(r => r.result === 'W' || r.result === 'L');
  const wins = completed.filter(r => r.result === 'W').length;
  const losses = completed.filter(r => r.result === 'L').length;
  const noFires = completed.filter(r => r.result === 'NF').length;
  const totalSignaled = completed.filter(r => r.light).length;

  let streak = 0;
  const firedSorted = fired.slice().sort((a, b) => b.date.localeCompare(a.date));
  for (const r of firedSorted) {
    if (r.result === 'W') streak++;
    else break;
  }

  const greenDays = completed.filter(r => r.light === 'green' && (r.result === 'W' || r.result === 'L'));
  const greenWins = greenDays.filter(r => r.result === 'W').length;
  const signalAccuracy = greenDays.length > 0 ? Math.round((greenWins / greenDays.length) * 100) : null;
  const fireRate = totalSignaled > 0 ? Math.round((fired.length / totalSignaled) * 100) : null;
  const winRate = fired.length > 0 ? Math.round((wins / fired.length) * 100) : null;

  return {
    today,
    todayKey,
    todayRow,
    thisMonday,
    currentWeek,
    pastWeeks,
    weekKeys,
    kpis: { wins, losses, noFires, winRate, streak, signalAccuracy, fireRate, totalSignaled, firedCount: fired.length }
  };
}

// =========================================================================
// Rendering
// =========================================================================
function $(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function formatPnl(n) {
  if (n === null || n === undefined || isNaN(n)) return null;
  if (n === 0) return '$0.00';
  const sign = n > 0 ? '+' : '-';
  return `${sign}$${Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}`;
}

function renderHeader(vm) {
  const headerDate = formatDate(vm.today, 'header');
  return `
    <div class="header">
      <div class="logo">
        <div class="logo-mark">V</div>
        <div class="logo-text">
          <h1>VECTOR SIGNAL BOARD</h1>
          <div class="tag">Public track record · NQ futures automation</div>
        </div>
      </div>
      <div class="header-meta">
        <span class="live-pill"><span class="dot"></span>Live</span>
        <span class="header-date">${headerDate}</span>
      </div>
    </div>
  `;
}

function renderHero(vm) {
  const r = vm.todayRow;
  const hasLight = r && r.light && ['green','yellow','red'].includes(r.light);
  const lightColor = hasLight ? r.light : 'pending';
  const lightLabel = hasLight ? r.light.toUpperCase() : 'AWAITING';
  const rationale = hasLight ? r.light_rationale : 'Morning traffic light signal has not been published yet today.';

  const vix = r && r.vix ? r.vix : '—';
  const vixDelta = r && r.vix_delta ? r.vix_delta : '';
  const oil = r && r.oil ? `$${r.oil}` : '—';
  const oilDelta = r && r.oil_delta ? r.oil_delta : '';
  const geo = r && r.geo_status ? r.geo_status : '—';
  const geoNote = r && r.geo_note ? r.geo_note : '';

  let pickHtml;
  if (r && r.strategy) {
    const dayChip = formatDate(vm.today, 'full');
    const cycleLabel = r.week_num ? `Cycle Wk ${String(r.week_num).padStart(2,'0')}` : '';
    let statusClass, statusLeft, statusRight;
    if (r.status === 'completed') {
      if (r.result === 'W') {
        statusClass = 'completed-win';
        statusLeft = 'Completed · Win';
        statusRight = formatPnl(r.pnl_1nq) || '';
      } else if (r.result === 'L') {
        statusClass = 'completed-loss';
        statusLeft = 'Completed · Loss';
        statusRight = formatPnl(r.pnl_1nq) || '';
      } else {
        statusClass = 'completed-nf';
        statusLeft = 'Completed · No Fire';
        statusRight = '$0.00';
      }
    } else if (r.status === 'live') {
      statusClass = 'live';
      statusLeft = 'Live · In progress';
      statusRight = '';
    } else {
      statusClass = 'scheduled';
      statusLeft = 'Scheduled';
      statusRight = '';
    }

    pickHtml = `
      <div class="card pick-card">
        <div class="pick-top">
          <div><div class="pick-day-chip">${esc(dayChip)}</div></div>
          ${cycleLabel ? `<div class="pick-cycle">${esc(cycleLabel)}</div>` : ''}
        </div>
        <div>
          <div class="pick-strategy">${esc(r.strategy)}</div>
          <div class="pick-caption">Vector Algorithmics strategy</div>
          <div class="pick-grid">
            <div class="pick-field"><div class="k">Instrument</div><div class="v">${esc(r.instrument)}</div></div>
            <div class="pick-field"><div class="k">Basis</div><div class="v">1 NQ</div></div>
            <div class="pick-field"><div class="k">Timeframe</div><div class="v">${esc(r.timeframe)}</div></div>
            <div class="pick-field"><div class="k">Style</div><div class="v">${esc(r.direction || '—')}</div></div>
          </div>
        </div>
        <div class="pick-status ${statusClass}">
          <div class="left"><span class="dot"></span>${esc(statusLeft)}</div>
          ${statusRight ? `<div class="right">${esc(statusRight)}</div>` : ''}
        </div>
      </div>
    `;
  } else {
    pickHtml = `
      <div class="card pick-card">
        <div class="pick-top">
          <div><div class="pick-day-chip">${esc(formatDate(vm.today, 'full'))}</div></div>
        </div>
        <div>
          <div class="pick-strategy" style="opacity:0.5">Awaiting</div>
          <div class="pick-caption">Today's pick has not been published yet.</div>
        </div>
        <div class="pick-status scheduled">
          <div class="left"><span class="dot"></span>Pending</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="hero">
      <div class="card signal-card">
        <div class="card-label"><span class="icon">🚦</span>Today's Traffic Light</div>
        <div class="light-hero">
          <div class="light-orb ${lightColor}"></div>
          <div class="light-info">
            <div class="status-text ${lightColor}">${lightLabel}</div>
            <div class="status-note">${esc(rationale)}</div>
          </div>
        </div>
        <div class="conditions">
          <div class="cond">
            <div class="icon">📊</div>
            <div class="lbl">VIX</div>
            <div class="val">${esc(vix)}</div>
            <div class="delta">${esc(vixDelta)}</div>
          </div>
          <div class="cond">
            <div class="icon">🛢️</div>
            <div class="lbl">WTI Crude</div>
            <div class="val">${esc(oil)}</div>
            <div class="delta">${esc(oilDelta)}</div>
          </div>
          <div class="cond">
            <div class="icon">🌍</div>
            <div class="lbl">Geopolitical</div>
            <div class="val">${esc(geo)}</div>
            <div class="delta">${esc(geoNote)}</div>
          </div>
        </div>
      </div>
      ${pickHtml}
    </div>
  `;
}

function renderKpis(vm) {
  const k = vm.kpis;
  const record = `${k.wins}<small>W</small> · ${k.losses}<small>L</small>`;
  const nfNote = k.noFires === 1 ? '1 no-fire day' : `${k.noFires} no-fire days`;
  const winRate = k.winRate !== null ? `${k.winRate}<small>%</small>` : '—';
  const streak = k.streak > 0 ? `${k.streak}<small>W</small>` : '0';
  const signal = k.signalAccuracy !== null ? `${k.signalAccuracy}<small>%</small>` : '—';
  const fire = k.fireRate !== null ? `${k.fireRate}<small>%</small>` : '—';
  const fireSub = k.totalSignaled > 0 ? `${k.firedCount} of ${k.totalSignaled} days fired` : 'No data yet';

  return `
    <div class="kpi-strip">
      <div class="kpi"><div class="icon">🏆</div><div class="lbl">Record</div><div class="val">${record}</div><div class="sub">${nfNote}</div></div>
      <div class="kpi"><div class="icon">🎯</div><div class="lbl">Win Rate</div><div class="val">${winRate}</div><div class="sub">Fired trades</div></div>
      <div class="kpi"><div class="icon">🔥</div><div class="lbl">Current Streak</div><div class="val">${streak}</div><div class="sub">Consecutive wins</div></div>
      <div class="kpi"><div class="icon">🚦</div><div class="lbl">Signal Accuracy</div><div class="val">${signal}</div><div class="sub">Green day hit rate</div></div>
      <div class="kpi"><div class="icon">⚡</div><div class="lbl">Fire Rate</div><div class="val">${fire}</div><div class="sub">${fireSub}</div></div>
    </div>
  `;
}

function renderWeekInProgress(vm) {
  const postedDate = formatDate(vm.thisMonday, 'short');
  let rowsHtml = '';
  let weekTotal = 0;
  let w = 0, l = 0, nf = 0;
  let anyPosted = false;

  vm.currentWeek.forEach(({ date, row }) => {
    const dayName = DAYS_FULL[date.getUTCDay()];
    const dateLabel = formatDate(date, 'chip');

    if (!row) {
      rowsHtml += `
        <tr>
          <td><div class="day-cell"><div class="day-name">${dayName}</div><div class="day-date">${dateLabel}</div></div></td>
          <td><span class="light-pill pending"><span class="dot"></span>Pending</span></td>
          <td><div class="strat-name" style="color:var(--text-muted)">Awaiting pick</div></td>
          <td><span class="result-badge pending">Awaiting</span></td>
          <td class="num"><span class="pnl pending">—</span></td>
        </tr>
      `;
      return;
    }
    anyPosted = true;

    const light = row.light && ['green','yellow','red'].includes(row.light) ? row.light : 'pending';
    const lightLabel = row.light && ['green','yellow','red'].includes(row.light) ? row.light.charAt(0).toUpperCase() + row.light.slice(1) : 'Pending';

    let resultHtml, pnlHtml;
    if (row.status === 'completed') {
      if (row.result === 'W') {
        w++;
        resultHtml = `<span class="result-badge w">Win</span>`;
        pnlHtml = `<span class="pnl pos">${formatPnl(row.pnl_1nq)}</span>`;
        weekTotal += row.pnl_1nq || 0;
      } else if (row.result === 'L') {
        l++;
        resultHtml = `<span class="result-badge l">Loss</span>`;
        pnlHtml = `<span class="pnl neg">${formatPnl(row.pnl_1nq)}</span>`;
        weekTotal += row.pnl_1nq || 0;
      } else {
        nf++;
        resultHtml = `<span class="result-badge nf">No Fire</span>`;
        pnlHtml = `<span class="pnl zero">$0.00</span>`;
      }
    } else {
      resultHtml = `<span class="result-badge pending">Awaiting</span>`;
      pnlHtml = `<span class="pnl pending">—</span>`;
    }

    rowsHtml += `
      <tr>
        <td><div class="day-cell"><div class="day-name">${dayName}</div><div class="day-date">${dateLabel}</div></div></td>
        <td><span class="light-pill ${light}"><span class="dot"></span>${lightLabel}</span></td>
        <td><div class="strat-name">${esc(row.strategy)}</div><div class="strat-sub">${esc(row.direction || '—')}</div></td>
        <td>${resultHtml}</td>
        <td class="num">${pnlHtml}</td>
      </tr>
    `;
  });

  const totalClass = weekTotal >= 0 ? '' : 'neg';
  const totalStr = weekTotal !== 0 ? formatPnl(weekTotal) : '$0.00';

  rowsHtml += `
    <tr class="total-row">
      <td colspan="2"><span class="lbl">Week to date · 1 NQ equivalent</span></td>
      <td></td>
      <td><span class="record-pill">${w}W · ${l}L · ${nf}NF</span></td>
      <td class="num"><span class="grand-total ${totalClass}">${totalStr}</span></td>
    </tr>
  `;

  return `
    <div class="section">
      <div class="section-head">
        <h2><span class="icon">📅</span>Week in Progress</h2>
        <div class="meta">Week of ${postedDate}</div>
      </div>
      <div class="card table-card">
        <table class="picks">
          <thead>
            <tr>
              <th style="width: 140px;">Day</th>
              <th style="width: 130px;">Signal</th>
              <th>Strategy</th>
              <th style="width: 130px;">Result</th>
              <th class="num" style="width: 140px;">Per 1 NQ</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderHistory(vm) {
  if (vm.weekKeys.length === 0) {
    const fri = fridayOf(vm.today);
    return `
      <div class="section">
        <div class="section-head">
          <h2><span class="icon">📜</span>Signal History</h2>
          <div class="meta">Completed weeks · Newest first</div>
        </div>
        <div class="card history-empty">
          <div class="empty-icon">📅</div>
          <div class="empty-title">History begins with the current week</div>
          <div class="empty-body">First completed week posts here Friday, ${formatDate(fri, 'short')}. Each week's results will populate below as they finalize.</div>
        </div>
      </div>
    `;
  }

  const weeksHtml = vm.weekKeys.map(wk => {
    const rows = vm.pastWeeks[wk];
    const weekStart = parseDate(wk);
    const weekEnd = new Date(weekStart);
    weekEnd.setUTCDate(weekEnd.getUTCDate() + 4);
    const weekNum = rows[0].week_num ? String(rows[0].week_num).padStart(2, '0') : '';
    const rangeStr = `${formatDate(weekStart, 'short')} – ${formatDate(weekEnd, 'short')}`;

    let weekTotal = 0, w = 0, l = 0, nf = 0;
    const dayHtml = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(weekStart);
      d.setUTCDate(d.getUTCDate() + i);
      const key = dateKey(d);
      const row = rows.find(r => r.date === key);
      const dayLabel = DAYS[d.getUTCDay()];

      if (!row || row.status !== 'completed') {
        dayHtml.push(`<div class="day-chip"><div class="d">${dayLabel}</div><div class="r nf">·</div><div class="strat">—</div><div class="pts dash">—</div></div>`);
        continue;
      }
      if (row.result === 'W') {
        w++; weekTotal += row.pnl_1nq || 0;
        dayHtml.push(`<div class="day-chip"><div class="d">${dayLabel}</div><div class="r w">W</div><div class="strat">${esc(row.strategy)}</div><div class="pts">${formatPnl(row.pnl_1nq)}</div></div>`);
      } else if (row.result === 'L') {
        l++; weekTotal += row.pnl_1nq || 0;
        dayHtml.push(`<div class="day-chip"><div class="d">${dayLabel}</div><div class="r l">L</div><div class="strat">${esc(row.strategy)}</div><div class="pts" style="color:var(--red)">${formatPnl(row.pnl_1nq)}</div></div>`);
      } else {
        nf++;
        dayHtml.push(`<div class="day-chip"><div class="d">${dayLabel}</div><div class="r nf">NF</div><div class="strat">${esc(row.strategy)}</div><div class="pts zero">$0.00</div></div>`);
      }
    }

    const totalClass = weekTotal >= 0 ? '' : 'neg';
    return `
      <div class="history-week">
        <div class="week-label-block">
          <div class="wk">Week ${weekNum}</div>
          <div class="range">${rangeStr}</div>
        </div>
        <div class="week-days">${dayHtml.join('')}</div>
        <div class="week-summary-block">
          <div class="total ${totalClass}">${formatPnl(weekTotal) || '$0.00'}</div>
          <div class="record">${w}W · ${l}L${nf > 0 ? ` · ${nf}NF` : ''}</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="section">
      <div class="section-head">
        <h2><span class="icon">📜</span>Signal History</h2>
        <div class="meta">Completed weeks · Newest first</div>
      </div>
      <div class="card history-card">${weeksHtml}</div>
    </div>
  `;
}

function renderMethodology() {
  return `
    <div class="method-grid">
      <div class="card method-body">
        <h3>🧠 How it works</h3>
        <p>Every weekday, a single strategy is selected for live execution on NQ futures. Picks are posted publicly on <strong>Sunday evening</strong> for the week ahead and do not change mid-cycle. No hindsight. No cherry-picking.</p>
        <p>Strategy selection uses a <strong>nine-week backward lookback</strong> with streak-aware scoring and variable commitment cycles. Monday through Wednesday run on 3-week cycles, Thursday and Friday run on 2-week cycles. All strategies are fully automated, hands-off algorithmic systems provided by Vector Algorithmics.</p>
        <p>Each morning before the open, a <strong>traffic light signal</strong> is published based on VIX, energy markets, and overnight geopolitical developments. Green clears the strategy to run at full size. Yellow or Red reduce size or stand down.</p>
        <p>Results shown reflect what a <strong>single NQ contract</strong> would have earned on each day's pick. No account balances, no personal positions, just the signal and the outcome.</p>
      </div>
      <div class="card method-aside">
        <h3>At a Glance</h3>
        <ul>
          <li><span class="k">Market</span><span class="v">NQ Futures</span></li>
          <li><span class="k">Timeframe</span><span class="v">15 min</span></li>
          <li><span class="k">Provider</span><span class="v">Vector Algo</span></li>
          <li><span class="k">Platform</span><span class="v">NinjaTrader 8</span></li>
          <li><span class="k">Execution</span><span class="v">Hands-off</span></li>
          <li><span class="k">Published</span><span class="v">Daily 8:45 ET</span></li>
          <li><span class="k">Coverage</span><span class="v">Mon – Fri</span></li>
        </ul>
      </div>
    </div>
  `;
}

function renderReferral() {
  return `
    <div class="referral">
      <div>
        <h3>Access the same strategies <span class="accent">directly from Vector.</span></h3>
        <p>The algorithmic systems shown on this board are developed and maintained by Vector Algorithmics. Licensing is available for qualified traders running NinjaTrader 8 on a funded account.</p>
      </div>
      <div style="text-align: right;">
        <a href="${esc(CONFIG.REFERRAL_URL)}" class="referral-btn" target="_blank" rel="noopener">
          <span>Request Access</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>
  `;
}

function renderFooter() {
  return `
    <footer>
      <div class="col"><h4>Vector Signal Board</h4>An editorial log of automated NQ futures signals, updated each trading day. Independent record. Not investment advice.</div>
      <div class="col"><h4>Data Integrity</h4>Picks are locked by 6 PM ET on the Sunday prior. Daily signals publish by 8:45 AM ET. Results are recorded from broker execution logs within two hours of settlement.</div>
      <div class="col"><h4>Disclosure</h4>Per-contract results are reported net of estimated commissions. Futures trading involves substantial risk of loss. Past performance does not guarantee future results.</div>
    </footer>
  `;
}

function render(vm, errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader(vm)}
    ${errorMsg ? `<div class="error-banner">${esc(errorMsg)}</div>` : ''}
    ${renderHero(vm)}
    ${renderKpis(vm)}
    ${renderWeekInProgress(vm)}
    ${renderHistory(vm)}
    ${renderMethodology()}
    ${renderReferral()}
    ${renderFooter()}
  `;
}

// =========================================================================
// Main
// =========================================================================
async function load() {
  try {
    const rows = await fetchSignals();
    const vm = deriveViewModel(rows);
    render(vm, null);
  } catch (err) {
    console.error(err);
    const empty = { today: new Date(), todayKey: dateKey(new Date()), todayRow: null, thisMonday: mondayOf(new Date()), currentWeek: [], pastWeeks: {}, weekKeys: [], kpis: { wins:0, losses:0, noFires:0, winRate:null, streak:0, signalAccuracy:null, fireRate:null, totalSignaled:0, firedCount:0 } };
    empty.today.setUTCHours(0,0,0,0);
    for (let i=0; i<5; i++) { const d = new Date(empty.thisMonday); d.setUTCDate(d.getUTCDate()+i); empty.currentWeek.push({date:d, key:dateKey(d), row:null}); }
    render(empty, err.message || 'Failed to load signal data.');
  }
  document.getElementById('loading').classList.add('hidden');
}

load();
setInterval(load, CONFIG.REFRESH_INTERVAL_MS);
</script>

</html>
